<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ons verhaal — INRYOU</title>
  <meta name="description" content="Het verhaal achter INRYOU: waarom we een rustigere, natuurlijke drank maakten — geboren in België, gemaakt om balans moeiteloos te maken." />
  <link rel="icon" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <noscript><style>body{opacity:1!important}</style></noscript>
</head>
<body data-page="story.html">
  <noscript><p style="text-align:center;padding:1rem;background:#1A1A1A;color:#F5F0E7;">INRYOU werkt het best met JavaScript ingeschakeld.</p></noscript>

  <main id="main">
    <section class="page-head">
      <div class="container reveal">
        <span class="kicker" data-i18n="story.kicker"></span>
        <h1 class="display" data-i18n-html="story.title"></h1>
        <p class="lead story-lead" data-i18n="story.lead"></p>
      </div>
    </section>

    <section class="section--tight">
      <div class="container">
        <div class="split__media reveal" style="aspect-ratio:16/9;max-height:62vh">
          <img src="assets/can-in-hand.jpg" alt="Hand houdt een INRYOU Cranberry blikje tegen een blauwe lucht" loading="lazy" />
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container--narrow prose reveal" style="margin-inline:auto">
        <p data-i18n="story.p1"></p>
        <h2 data-i18n="story.h2a"></h2>
        <p data-i18n="story.p2"></p>
        <h2 data-i18n="story.h2b"></h2>
        <p data-i18n="story.p3"></p>
      </div>
    </section>

    <section class="section--tight">
      <div class="container">
        <blockquote class="pull-quote reveal" data-i18n="story.quote"></blockquote>
      </div>
    </section>

    <section class="section--tight">
      <div class="container center">
        <a class="btn" href="shop.html" data-i18n="story.cta"></a>
      </div>
    </section>
  </main>

  <script src="app.js" defer></script>

</html>
