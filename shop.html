<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — INRYOU</title>
  <meta name="description" content="Shop de drie sprankelende INRYOU-smaken: Cranberry, Ginger & Citrus en Kweepeer & Vanille. Functioneel in balans, zonder toegevoegde suikers." />
  <link rel="icon" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <noscript><style>body{opacity:1!important}</style></noscript>
</head>
<body data-page="shop.html">
  <noscript><p style="text-align:center;padding:1rem;background:#1A1A1A;color:#F5F0E7;">INRYOU werkt het best met JavaScript ingeschakeld.</p></noscript>

  <main id="main">
    <section class="page-head">
      <div class="container reveal">
        <span class="kicker" data-i18n="shop.kicker"></span>
        <h1 class="display" data-i18n-html="shop.title"></h1>
        <p class="lead" data-i18n="shop.text"></p>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container">
        <div class="product-grid" data-shop-grid></div>
        <p class="shop-note muted" data-i18n="shop.pack"></p>
      </div>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
