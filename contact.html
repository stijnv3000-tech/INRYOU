<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — INRYOU</title>
  <meta name="description" content="Neem contact op met INRYOU — een vraag, een samenwerking of gewoon een groet. We lezen elk bericht." />
  <link rel="icon" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <noscript><style>body{opacity:1!important}</style></noscript>
</head>
<body data-page="contact.html">
  <noscript><p style="text-align:center;padding:1rem;background:#1A1A1A;color:#F5F0E7;">INRYOU werkt het best met JavaScript ingeschakeld.</p></noscript>

  <main id="main">
    <section class="page-head">
      <div class="container reveal">
        <span class="kicker" data-i18n="contact.kicker"></span>
        <h1 class="display" data-i18n-html="contact.title"></h1>
        <p class="lead" data-i18n="contact.lead"></p>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container contact-layout">
        <!-- Front-end only: submit is stubbed in app.js, no data leaves the page. -->
        <form class="contact-form reveal" data-contact-form novalidate>
          <div class="contact-form__row">
            <div class="field">
              <label for="c-name" data-i18n="contact.formName"></label>
              <input id="c-name" name="name" class="input" required />
            </div>
            <div class="field">
              <label for="c-email" data-i18n="contact.formEmail"></label>
              <input id="c-email" name="email" type="email" class="input" required />
            </div>
          </div>
          <div class="field">
            <label for="c-subject" data-i18n="contact.formSubject"></label>
            <input id="c-subject" name="subject" class="input" />
          </div>
          <div class="field">
            <label for="c-message" data-i18n="contact.formMessage"></label>
            <textarea id="c-message" name="message" class="textarea" required></textarea>
          </div>
          <button class="btn" type="submit" data-i18n="contact.send"></button>
          <p class="contact-msg" data-contact-msg role="status" aria-live="polite"></p>
        </form>

        <aside class="contact-aside reveal">
          <div class="contact-block">
            <h3 data-i18n="contact.reachTitle"></h3>
            <p><a href="mailto:hello@inryou.be">hello@inryou.be</a></p>
          </div>
          <div class="contact-block">
            <h3 data-i18n="contact.hoursTitle"></h3>
            <p class="muted" data-i18n="contact.hours"></p>
          </div>
          <div class="contact-block">
            <h3 data-i18n="contact.socialTitle"></h3>
            <div class="footer-social">
              <a class="social" href="#" aria-label="Instagram"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a>
              <a class="social" href="#" aria-label="TikTok"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 4c.6 2.5 2.2 4.1 4.7 4.4v3.1c-1.7.1-3.3-.4-4.7-1.3v5.9a5.6 5.6 0 1 1-5.6-5.6c.3 0 .6 0 .9.1v3.2a2.5 2.5 0 1 0 1.8 2.4V4z"/></svg></a>
              <a class="social" href="#" aria-label="LinkedIn"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 10v7M7 7v.01M11 17v-4a2 2 0 0 1 4 0v4M11 17v-7"/></svg></a>
            </div>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
